source:
  type: values

sink:
  type: values

pipeline:
  name: priority-test-pipeline
  parallelism: 2
  flink-conf:
    # 1. Option present in config.yaml (1), pipeline.yaml (2), and overridden by CLI (3)
    parallelism.default: 2
    # 2. Option present in config.yaml (1) and pipeline.yaml (4), NOT in CLI -> pipeline.yaml wins
    taskmanager.numberOfTaskSlots: 4
    # 3. Option present in pipeline.yaml (12min) and overridden by CLI (11min)
    execution.checkpointing.timeout: 12min
    # 4. Option present only in pipeline.yaml
    execution.checkpointing.interval: 3min
