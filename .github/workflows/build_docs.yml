name: "Build documentation"

on:
  pull_request:
    branches:
      - master
      - release-*
    paths:
      - 'docs/**'
      - '.github/workflows/build_docs.yml'
      - '.github/workflows/docs.sh'
  schedule:
    - cron: '0 0 * * *' # Deploy every day
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-doc:
    if: github.repository == 'apache/flink-cdc'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        if: hashFiles('docs/package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build Docusaurus site
        if: hashFiles('docs/package.json') != ''
        run: |
          npm --prefix docs ci
          npm --prefix docs test
          npm --prefix docs run build
      - name: Build doc
        run: |
          docker run --rm --env DOCS_SKIP_SITE_BUILD=true --volume "$PWD:/root/flink-cdc" chesnay/flink-ci:java_8_11_17_21_maven_386 bash -c "cd /root/flink-cdc && chmod +x ./.github/workflows/docs.sh && ./.github/workflows/docs.sh"

  build-documentation:
    if: github.event_name != 'pull_request' && github.repository == 'apache/flink-cdc'
    name: "Check and build doc"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        branch:
          - master
          - release-3.7
          - release-3.6

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Node.js
        if: hashFiles('docs/package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set branch environment variable
        run: |
          currentBranch=$(git branch --show-current)
          
          echo "flink_branch=${currentBranch}" >> ${GITHUB_ENV}
          
          if [ "${currentBranch}" = "master" ]; then
          echo "flink_alias=release-3.8" >> ${GITHUB_ENV}
          elif [ "${currentBranch}" = "release-3.7" ]; then
          echo "flink_alias=stable" >> ${GITHUB_ENV}
          fi

      - name: Build Docusaurus site
        if: hashFiles('docs/package.json') != ''
        run: |
          npm --prefix docs ci
          npm --prefix docs test
          npm --prefix docs run build

      - name: Build documentation
        run: |
          docker run --rm --env DOCS_SKIP_SITE_BUILD=true --volume "$PWD:/root/flink-cdc" chesnay/flink-ci:java_8_11_17_21_maven_386 bash -c "cd /root/flink-cdc && chmod +x ./.github/workflows/docs.sh && ./.github/workflows/docs.sh"

      - name: Build Docusaurus alias
        if: hashFiles('docs/package.json') != '' && env.flink_alias != ''
        env:
          DOCS_BASE_URL: /flink/flink-cdc-docs-${{ env.flink_alias }}/
        run: |
          npm --prefix docs run build -- --out-dir target-alias
          cp -R docs/target/api docs/target-alias/api

      - name: Upload documentation
        uses: ./.github/actions/rsync-deployments
        with:
          switches: --archive --compress --delete
          path: docs/target/
          remote_path: ${{ secrets.NIGHTLIES_RSYNC_PATH }}/flink/flink-cdc-docs-${{ env.flink_branch }}/
          remote_host: ${{ secrets.NIGHTLIES_RSYNC_HOST }}
          remote_port: ${{ secrets.NIGHTLIES_RSYNC_PORT }}
          remote_user: ${{ secrets.NIGHTLIES_RSYNC_USER }}
          remote_key: ${{ secrets.NIGHTLIES_RSYNC_KEY }}

      - name: Upload documentation alias
        if: env.flink_alias != ''
        uses: ./.github/actions/rsync-deployments
        with:
          switches: --archive --compress --delete
          path: ${{ hashFiles('docs/package.json') != '' && 'docs/target-alias/' || 'docs/target/' }}
          remote_path: ${{ secrets.NIGHTLIES_RSYNC_PATH }}/flink/flink-cdc-docs-${{ env.flink_alias }}/
          remote_host: ${{ secrets.NIGHTLIES_RSYNC_HOST }}
          remote_port: ${{ secrets.NIGHTLIES_RSYNC_PORT }}
          remote_user: ${{ secrets.NIGHTLIES_RSYNC_USER }}
          remote_key: ${{ secrets.NIGHTLIES_RSYNC_KEY }}
